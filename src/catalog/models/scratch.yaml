# A blank Archspec model.
#
# Every top-level section is required, even when empty. Fill them in and
# the parser, the validator, and the model checker run as you type; the
# panel on the right is the same visualization `archspec-viz` writes.
#
#   services       who runs code: backend, frontend, worker, job
#   schemas        canonical field sets, and fragments projected from them
#   data_models    persistent objects, their schema and their identity
#   topics         message channels, their ordering and message identity
#   state_machines lifecycles: states, transitions, transition-owned effects
#   operations     inputs, transactions, effects, flows, and the
#                  requirements the checker is asked to prove

revision: 1

services:
  service.example:
    kind: backend

schemas:
  schema.Greeting:
    kind: canonical
    description: Something worth announcing.
    completeness: complete
    fields:
      greeting_id:
        ty:
          kind: scalar
          value: uuid
        optional: false
      text:
        ty:
          kind: scalar
          value: string
        optional: false

data_models: {}

topics:
  topic.greetings:
    messages:
      - schema.Greeting
    ordering:
      kind: unordered
    message_identity:
      kind: keyed
      mapping:
        schema.Greeting:
          - - greeting_id

state_machines: {}

operations: {}
